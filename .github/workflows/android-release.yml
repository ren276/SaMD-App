name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # KEYSTORE_BASE64 is the prod signing keystore, base64-encoded, stored as a GitHub Secret.
      # Decoded to a runner-local temp path — never written into the repo or a cached layer.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Run Prod release unit tests
        run: ./gradlew testProdReleaseUnitTest --console=plain

      - name: Assemble Prod release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleProdRelease --console=plain

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: samdapp-prod-release-${{ github.ref_name }}
          path: app/build/outputs/apk/prod/release/*.apk
