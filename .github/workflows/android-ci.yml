name: Android CI

on:
  push:
    branches: [ "master", "**abha**", "**ABHA**" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [ Dev, Staging, Prod ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble ${{ matrix.flavor }}Debug
        run: ./gradlew assemble${{ matrix.flavor }}Debug --console=plain

      - name: Run ${{ matrix.flavor }}Debug unit tests
        run: ./gradlew test${{ matrix.flavor }}DebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ matrix.flavor }}
          path: app/build/reports/tests/test${{ matrix.flavor }}DebugUnitTest/
