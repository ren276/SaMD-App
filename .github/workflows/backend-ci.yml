name: Backend CI

# Path filtered so an Android-only commit does not run this, and a backend-only commit does not
# run the three-flavor Android matrix. The existing android-ci.yml and android-release.yml are
# untouched by this workflow.
on:
  push:
    branches: [ "master", "**abha**", "**ABHA**" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/core

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: samd
          POSTGRES_PASSWORD: samd_dev_only
          POSTGRES_DB: samd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U samd -d samd_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: dev
      REQUIRE_HTTPS: "false"
      DATABASE_URL: postgresql+asyncpg://samd:samd_dev_only@localhost:5432/samd_test
      TEST_DATABASE_URL: postgresql+asyncpg://samd:samd_dev_only@localhost:5432/samd_test
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip==25.0
          pip install -e ".[dev]"
          # backend/abdm-adapter is a sibling package, not a subdirectory of backend/core, and is
          # not on PyPI: it must be installed explicitly or nothing in this job ever imports it,
          # lints it, or runs its tests, even though app/main.py imports it at runtime.
          pip install -e "../abdm-adapter[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      # backend/abdm-adapter has its own pyproject.toml and its own ruff config (matching
      # backend/core's), so it needs its own invocation; ruff does not look outside the directory
      # it is pointed at.
      - name: Ruff lint (abdm-adapter)
        working-directory: backend/abdm-adapter
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Alembic upgrade head
        run: alembic upgrade head

      # A schema change with no migration behind it fails the build. Without this the models and
      # the migrations drift apart quietly, and the first symptom is a production deploy that
      # cannot start.
      - name: Alembic has no pending autogenerate diff
        run: alembic check

      - name: Pytest
        run: pytest -q

      # backend/abdm-adapter/tests/ and backend/core/tests/ are both packages named "tests"; pytest
      # cannot collect them in one invocation without an import collision, so this is a genuinely
      # separate step, not a style choice. A failure here fails the build exactly like the step
      # above: no continue-on-error, no separate non-blocking job.
      - name: Pytest (abdm-adapter)
        working-directory: backend/abdm-adapter
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t samd-backend-core:ci backend/core

      - name: Confirm the image does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh samd-backend-core:ci -c 'id -u')
          echo "container uid: $user"
          test "$user" != "0"
