[project]
name = "samd-backend-core"
version = "0.1.0"
description = "SaMD Core API for the PHC Patient Care Android app"
requires-python = "==3.12.*"

# Versions are pinned exactly, no ranges, mirroring the libs.versions.toml discipline on the
# Android side. This file plus uv.lock is SBOM input (see docs/sbom/README.md).
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",
    "alembic==1.14.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.1",
    "httpx==0.28.1",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "types-python-jose==3.3.4.20240106",
]

[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "RUF"]
# S101: assert is how tests assert.
# B008: FastAPI Depends() in a default argument is the framework's idiom, not a bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["N999", "E501"]
# S105/S106 flag any identifier containing "token" or "secret" as a hardcoded credential. Every
# hit in these files is an enum member name, a literal "Bearer", a token_type discriminator, or a
# CHANGE_ME placeholder that the startup guard in config.py exists to reject.
"app/config.py" = ["S105"]
"app/errors.py" = ["S105"]
"app/models/enums.py" = ["S105"]
"app/schemas/auth.py" = ["S105"]
"app/services/auth.py" = ["S105", "S106"]
# A005: app/logging.py shadows the stdlib logging module by name. Python 3 uses absolute imports,
# so `import logging` inside the package still resolves to the stdlib. The name is worth more
# than the lint.
"app/logging.py" = ["A005"]
"app/db/types.py" = ["A005"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []
exclude = ["alembic/versions/"]
# backend/abdm-adapter is installed editable via a PEP 660 finder-based .pth (uv/setuptools),
# which mypy's import discovery does not execute; it needs the real source path directly.
mypy_path = ["../abdm-adapter"]

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
